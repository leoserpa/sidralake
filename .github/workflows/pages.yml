name: Deploy SidraLake BI (Evidence.dev -> GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "dbt_project/**"
      - "src/ibge_market_intel/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Atualiza mensalmente no dia 16 as 11:00 UTC (08:00 BRT), apos divulgacao IPCA/PMC
    - cron: "0 11 16 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de materializacao IBGE (full = 5.571 municipios, smoke = SP/MT)"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python & dbt dependencies
        run: |
          uv sync --dev
          uv run dbt deps --project-dir dbt_project --profiles-dir dbt_project

      - name: Materialize SidraLake Medallion Pipeline (IBGE -> Bronze -> Silver -> Gold)
        env:
          SIDRALAKE_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          uv run sidralake run --mode "$SIDRALAKE_MODE"
          uv run sidralake export-bi --freshness-file .github/last_data_refresh.json

      - name: Upload freshness manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshness-manifest
          path: .github/last_data_refresh.json
          retention-days: 1

      - name: Pre-build BI Quality Gate (static contracts + 78 SQL queries with DuckDB-WASM DOUBLE emulation)
        env:
          SIDRALAKE_MODE: ${{ github.event.inputs.mode || 'full' }}
          SIDRALAKE_REQUIRE_BI_DATA: "1"
        run: |
          if [ "$SIDRALAKE_MODE" = "full" ]; then
            uv run sidralake validate-bi
          else
            uv run sidralake validate-bi --allow-empty
          fi
          uv run pytest tests/unit/test_dashboard_integrity.py tests/integration/test_dashboard_live_data.py -v

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Evidence.dev dependencies & build static BI
        working-directory: dashboard
        run: |
          npm install
          npm run sources:strict
          npm run build
          touch build/.nojekyll

      - name: Post-build Artifact & Headless Chromium E2E Smoke Test (all 9 pages + interactive filters + 390x844 mobile)
        env:
          SIDRALAKE_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          if [ "$SIDRALAKE_MODE" = "full" ]; then
            uv run sidralake validate-bi --check-build
          else
            uv run sidralake validate-bi --check-build --allow-empty
          fi
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            (cd dashboard && npx playwright-core install --with-deps chromium)
          fi
          CHROME_PATH="$CHROME_PATH" npm --prefix dashboard run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-freshness:
    needs: deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download freshness manifest
        uses: actions/download-artifact@v4
        with:
          name: freshness-manifest
          path: .github

      - name: Commit freshness manifest (keeps 60-day schedule active)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last_data_refresh.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): registrar atualizacao mensal IBGE [skip ci]"
            git push
          fi
