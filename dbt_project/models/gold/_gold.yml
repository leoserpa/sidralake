version: 2

models:
  # ==================== DIMENSIONS ====================
  - name: dim_geografia
    description: "Dimensao geografica municipal (SCD Type 2) com hierarquia IBGE completa (Regiao Imediata, Intermediaria, UF e Grande Regiao)."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_municipio
        data_type: varchar
        tests: [unique, not_null]
      - name: codigo_ibge_municipio
        data_type: integer
        tests: [not_null]
      - name: nome_municipio
        data_type: varchar
        tests: [not_null]
      - name: codigo_uf
        data_type: integer
        tests: [not_null]
      - name: sigla_uf
        data_type: varchar
        tests: [not_null]
      - name: nome_uf
        data_type: varchar
        tests: [not_null]
      - name: codigo_regiao
        data_type: integer
        tests: [not_null]
      - name: sigla_regiao
        data_type: varchar
        tests: [not_null]
      - name: nome_regiao
        data_type: varchar
        tests: [not_null]
      - name: codigo_regiao_imediata
        data_type: integer
        tests: [not_null]
      - name: nome_regiao_imediata
        data_type: varchar
        tests: [not_null]
      - name: codigo_regiao_intermediaria
        data_type: integer
        tests: [not_null]
      - name: nome_regiao_intermediaria
        data_type: varchar
        tests: [not_null]
      - name: codigo_microrregiao
        data_type: integer
      - name: nome_microrregiao
        data_type: varchar
      - name: codigo_mesorregiao
        data_type: integer
      - name: nome_mesorregiao
        data_type: varchar
      - name: valid_from
        data_type: timestamp
      - name: valid_to
        data_type: timestamp
      - name: is_current
        data_type: boolean
        tests: [not_null]

  - name: dim_tempo
    description: "Dimensao calendario mensal dinamica (2018+) com indicador de ano censitario."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_tempo
        data_type: integer
        tests: [unique, not_null]
      - name: data_referencia
        data_type: date
        tests: [unique, not_null]
      - name: ano_referencia
        data_type: integer
        tests: [not_null]
      - name: mes_referencia
        data_type: integer
        tests: [not_null]
      - name: ano_mes
        data_type: varchar
        tests: [unique, not_null]
      - name: trimestre
        data_type: integer
        tests: [not_null]
      - name: semestre
        data_type: integer
        tests: [not_null]
      - name: is_ano_censitario
        data_type: boolean
        tests: [not_null]

  - name: time_spine_daily
    description: "Espinha dorsal temporal diaria dinamica (2018+) exigida pelo dbt Semantic Layer / MetricFlow."
    time_spine:
      standard_granularity_column: date_day
    config:
      contract:
        enforced: true
    columns:
      - name: date_day
        data_type: date
        granularity: day
        tests: [unique, not_null]

  - name: dim_cnae
    description: "Dimensao das 21 secoes CNAE 2.0 (SCD Type 2) mapeadas para a classificacao SIDRA 12762."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_cnae_secao
        data_type: varchar
        tests: [unique, not_null]
      - name: codigo_secao
        data_type: varchar
        tests: [not_null]
      - name: descricao_secao
        data_type: varchar
        tests: [not_null]
      - name: categoria_sidra_12762_id
        data_type: integer
        tests: [not_null]
      - name: valid_from
        data_type: timestamp
      - name: valid_to
        data_type: timestamp
      - name: is_current
        data_type: boolean
        tests: [not_null]

  - name: dim_atividade_varejo
    description: "Dimensao das 14 atividades comerciais da PMC agrupadas por segmento de consumo."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_atividade_varejo
        data_type: varchar
        tests: [unique, not_null]
      - name: codigo_atividade_pmc
        data_type: integer
        tests: [unique, not_null]
      - name: nome_atividade_pmc
        data_type: varchar
        tests: [not_null]
      - name: grupo_consumo
        data_type: varchar
        tests: [not_null]

  # ==================== FACTS (ENFORCED CONTRACTS) ====================
  - name: fct_pib_municipal
    description: "Fato anual do PIB e VAB setorial municipal a precos nominais e reais (deflacionados pelo IPCA)."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_pib_municipal
        data_type: varchar
        tests: [unique, not_null]
      - name: sk_municipio
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geografia')
                field: sk_municipio
      - name: codigo_ibge_municipio
        data_type: integer
        tests: [not_null]
      - name: ano_referencia
        data_type: integer
        tests: [not_null]
      - name: ano_mes_base_deflator
        data_type: varchar
      - name: fator_deflator_anual
        data_type: double
      - name: pib_nominal_mil_brl
        data_type: double
        tests: [not_null]
      - name: pib_real_mil_brl
        data_type: double
        tests: [not_null]
      - name: impostos_liquidos_mil_brl
        data_type: double
      - name: vab_total_mil_brl
        data_type: double
      - name: vab_agropecuaria_mil_brl
        data_type: double
      - name: vab_industria_mil_brl
        data_type: double
      - name: vab_servicos_privados_mil_brl
        data_type: double
      - name: vab_adm_publica_mil_brl
        data_type: double
      - name: share_vab_agropecuaria
        data_type: double
      - name: share_vab_industria
        data_type: double
      - name: share_vab_servicos_privados
        data_type: double
      - name: share_vab_adm_publica
        data_type: double
      - name: hhi_setorial
        data_type: double
      - name: indice_diversificacao_setorial
        data_type: double
      - name: crescimento_pib_real_yoy_pct
        data_type: double
      - name: cagr_pib_real_3a_pct
        data_type: double

  - name: fct_populacao_municipal
    description: "Fato anual da serie populacional municipal unificada (Censo 2022 + Estimativas + interpolacao 2023)."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_populacao_municipal
        data_type: varchar
        tests: [unique, not_null]
      - name: sk_municipio
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geografia')
                field: sk_municipio
      - name: codigo_ibge_municipio
        data_type: integer
        tests: [not_null]
      - name: ano_referencia
        data_type: integer
        tests: [not_null]
      - name: populacao_residente
        data_type: bigint
        tests: [not_null]
      - name: area_km2
        data_type: double
      - name: densidade_demografica
        data_type: double
      - name: origem_dado
        data_type: varchar
        tests: [not_null]
      - name: is_interpolado
        data_type: boolean
        tests: [not_null]

  - name: fct_cempre_municipal
    description: "Fato anual do Cadastro Central de Empresas municipal (nova serie 2022+)."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_cempre_municipal
        data_type: varchar
        tests: [unique, not_null]
      - name: sk_municipio
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geografia')
                field: sk_municipio
      - name: codigo_ibge_municipio
        data_type: integer
        tests: [not_null]
      - name: ano_referencia
        data_type: integer
        tests: [not_null]
      - name: ano_mes_base_deflator
        data_type: varchar
      - name: num_unidades_locais
        data_type: integer
      - name: num_empresas_atuantes
        data_type: integer
      - name: pessoal_ocupado_total
        data_type: integer
      - name: pessoal_ocupado_assalariado
        data_type: integer
      - name: pessoal_assalariado_medio
        data_type: integer
      - name: massa_salarial_nominal_mil_brl
        data_type: double
      - name: massa_salarial_real_mil_brl
        data_type: double
      - name: salario_medio_sm
        data_type: double
      - name: salario_medio_nominal_brl
        data_type: double
      - name: salario_medio_real_brl
        data_type: double
      - name: taxa_assalariamento_formal
        data_type: double
      - name: crescimento_empresas_yoy_pct
        data_type: double
      - name: crescimento_emprego_yoy_pct
        data_type: double

  - name: fct_cempre_setorial_uf
    description: "Fato anual do CEMPRE por UF e secao CNAE 2.0 com flag de sigilo estatistico."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_cempre_setorial_uf
        data_type: varchar
        tests: [unique, not_null]
      - name: codigo_uf
        data_type: integer
        tests: [not_null]
      - name: sk_cnae_secao
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae_secao
      - name: codigo_secao_cnae
        data_type: varchar
        tests: [not_null]
      - name: ano_referencia
        data_type: integer
        tests: [not_null]
      - name: num_empresas
        data_type: integer
      - name: pessoal_ocupado_total
        data_type: integer
      - name: pessoal_ocupado_assalariado
        data_type: integer
      - name: massa_salarial_nominal_mil_brl
        data_type: double
      - name: massa_salarial_real_mil_brl
        data_type: double
      - name: has_sigilo_estatistico
        data_type: boolean
        tests: [not_null]

  - name: fct_ipca_mensal
    description: "Fato mensal da inflacao IPCA Brasil com fator deflator para base corrente."
    config:
      contract:
        enforced: true
    columns:
      - name: ano_mes
        data_type: varchar
        tests: [unique, not_null]
      - name: ano_referencia
        data_type: integer
        tests: [not_null]
      - name: mes_referencia
        data_type: integer
        tests: [not_null]
      - name: data_referencia
        data_type: date
        tests: [not_null]
      - name: numero_indice_ipca
        data_type: double
        tests: [not_null]
      - name: variacao_mensal_pct
        data_type: double
      - name: variacao_acum_3m_pct
        data_type: double
      - name: variacao_acum_6m_pct
        data_type: double
      - name: variacao_acum_ano_pct
        data_type: double
      - name: variacao_acum_12m_pct
        data_type: double
      - name: ano_mes_base_deflator
        data_type: varchar
        tests: [not_null]
      - name: fator_deflator_base_atual
        data_type: double
        tests: [not_null]

  - name: fct_pmc_varejo_mensal
    description: "Fato mensal de receita nominal e volume de vendas do varejo ampliado (PMC) por UF e atividade."
    config:
      contract:
        enforced: true
    columns:
      - name: sk_pmc_mensal
        data_type: varchar
        tests: [unique, not_null]
      - name: codigo_uf
        data_type: integer
        tests: [not_null]
      - name: sk_atividade_varejo
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_atividade_varejo')
                field: sk_atividade_varejo
      - name: codigo_atividade_pmc
        data_type: integer
        tests: [not_null]
      - name: ano_mes
        data_type: varchar
        tests: [not_null]
      - name: ano_referencia
        data_type: integer
        tests: [not_null]
      - name: mes_referencia
        data_type: integer
        tests: [not_null]
      - name: data_referencia
        data_type: date
        tests: [not_null]
      - name: indice_receita_nominal
        data_type: double
      - name: indice_receita_nominal_sa
        data_type: double
      - name: var_mom_sa_receita_pct
        data_type: double
      - name: var_yoy_receita_nominal_pct
        data_type: double
      - name: var_acum_12m_receita_pct
        data_type: double
      - name: indice_volume_vendas
        data_type: double
      - name: indice_volume_vendas_sa
        data_type: double
      - name: var_mom_sa_volume_pct
        data_type: double
      - name: var_yoy_volume_pct
        data_type: double
      - name: var_acum_12m_volume_pct
        data_type: double

  # ==================== GOLD DATA MARTS / OBTs (CONTRACTS + SEMANTIC LAYER) ====================
  - name: mart_inteligencia_mercado_municipal
    description: >
      OBT 360 graus de Inteligencia de Mercado Municipal combinando Demografia, PIB Real,
      Diversificacao Produtiva (1 - HHI), Tecido Empresarial (CEMPRE) e Score composto IMS (0-100)
      com rankings nacional/estadual/regional e classificacao em Tiers estrategicos.
    config:
      contract:
        enforced: true
    semantic_model:
      enabled: true
    agg_time_dimension: data_referencia_anual
    derived_semantics:
      dimensions:
        - name: data_referencia_anual
          type: time
          granularity: year
          expr: "make_date(ano_referencia, 1, 1)"
          label: "Ano de Referencia"
    columns:
      - name: sk_inteligencia_municipal
        data_type: varchar
        entity:
          type: primary
          name: inteligencia_municipal
        tests: [unique, not_null]
      - name: sk_municipio
        data_type: varchar
        entity:
          type: foreign
          name: municipio
      - name: codigo_ibge_municipio
        data_type: integer
        tests: [not_null]
      - name: ano_referencia
        data_type: integer
        tests: [not_null]
      - name: is_ultimo_ano_completo
        data_type: boolean
        dimension:
          type: categorical
      - name: nome_municipio
        data_type: varchar
        dimension:
          type: categorical
      - name: codigo_uf
        data_type: integer
      - name: sigla_uf
        data_type: varchar
        dimension:
          type: categorical
      - name: nome_uf
        data_type: varchar
        dimension:
          type: categorical
      - name: sigla_regiao
        data_type: varchar
        dimension:
          type: categorical
      - name: nome_regiao
        data_type: varchar
        dimension:
          type: categorical
      - name: nome_regiao_imediata
        data_type: varchar
        dimension:
          type: categorical
      - name: nome_regiao_intermediaria
        data_type: varchar
        dimension:
          type: categorical
      - name: populacao_residente
        data_type: bigint
      - name: area_km2
        data_type: double
      - name: densidade_demografica
        data_type: double
      - name: origem_populacao
        data_type: varchar
        dimension:
          type: categorical
      - name: is_populacao_interpolada
        data_type: boolean
        dimension:
          type: categorical
      - name: ano_mes_base_deflator
        data_type: varchar
      - name: pib_nominal_mil_brl
        data_type: double
      - name: pib_real_mil_brl
        data_type: double
      - name: pib_per_capita_real_brl
        data_type: double
      - name: share_vab_agropecuaria
        data_type: double
      - name: share_vab_industria
        data_type: double
      - name: share_vab_servicos_privados
        data_type: double
      - name: share_vab_adm_publica
        data_type: double
      - name: hhi_setorial
        data_type: double
      - name: indice_diversificacao_setorial
        data_type: double
      - name: crescimento_pib_real_yoy_pct
        data_type: double
      - name: cagr_pib_real_3a_pct
        data_type: double
      - name: num_unidades_locais
        data_type: integer
      - name: num_empresas_atuantes
        data_type: integer
      - name: pessoal_ocupado_total
        data_type: integer
      - name: pessoal_ocupado_assalariado
        data_type: integer
      - name: massa_salarial_real_mil_brl
        data_type: double
      - name: salario_medio_real_brl
        data_type: double
      - name: salario_medio_sm
        data_type: double
      - name: taxa_assalariamento_formal
        data_type: double
      - name: empresas_por_1000_hab
        data_type: double
      - name: crescimento_empresas_yoy_pct
        data_type: double
      - name: crescimento_emprego_yoy_pct
        data_type: double
      - name: score_tamanho_mercado
        data_type: double
      - name: score_poder_compra
        data_type: double
      - name: score_dinamismo
        data_type: double
      - name: score_maturidade_empresarial
        data_type: double
      - name: ims_score_0_100
        data_type: double
      - name: rank_nacional_ims
        data_type: integer
      - name: rank_estadual_ims
        data_type: integer
      - name: rank_regional_ims
        data_type: integer
      - name: tier_mercado
        data_type: varchar
        dimension:
          type: categorical
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Tier 1 - Polo Nacional"
                  - "Tier 2 - Expansao Prioritaria"
                  - "Tier 3 - Emergente"
                  - "Tier 4 - Local / Nicho"
                  - "SEM_CLASSIFICACAO"
    metrics:
      - name: pib_real_total_mil_brl
        type: simple
        label: "PIB Real Total (Mil BRL)"
        description: "Soma do PIB municipal a precos constantes (deflacionado pelo IPCA)."
        agg: sum
        expr: pib_real_mil_brl
      - name: populacao_residente_total
        type: simple
        label: "Populacao Residente Total"
        description: "Soma da populacao residente nos municipios filtrados."
        agg: sum
        expr: populacao_residente
      - name: massa_salarial_real_total_mil_brl
        type: simple
        label: "Massa Salarial Real Total (Mil BRL)"
        description: "Soma da massa salarial formal deflacionada pelo IPCA."
        agg: sum
        expr: massa_salarial_real_mil_brl
      - name: empresas_atuantes_total
        type: simple
        label: "Empresas Atuantes (CEMPRE)"
        description: "Total de empresas formalmente atuantes registradas no CEMPRE."
        agg: sum
        expr: num_empresas_atuantes
      - name: ims_score_medio
        type: simple
        label: "Score IMS Medio (0-100)"
        description: "Media do Indice de Mercado SidraLake (IMS) no recorte geografico."
        agg: average
        expr: ims_score_0_100
      - name: pib_real_per_capita_agregado_brl
        type: derived
        label: "PIB Real Per Capita Agregado (BRL)"
        description: "Razao governada entre PIB real total (em BRL) e populacao residente total."
        expr: "(pib_real_mil * 1000.0) / pop_total"
        input_metrics:
          - name: pib_real_total_mil_brl
            alias: pib_real_mil
          - name: populacao_residente_total
            alias: pop_total

  - name: mart_clusters_setoriais_uf
    description: >
      Data Mart de Inteligencia Setorial por UF e Secao CNAE 2.0 com calculo de Quociente Locacional (QL)
      de emprego e massa salarial para identificacao objetiva de clusters produtivos especializados.
    config:
      contract:
        enforced: true
    semantic_model:
      enabled: true
    agg_time_dimension: data_referencia_anual_cnae
    derived_semantics:
      dimensions:
        - name: data_referencia_anual_cnae
          type: time
          granularity: year
          expr: "make_date(ano_referencia, 1, 1)"
          label: "Ano de Referencia Setorial"
    columns:
      - name: sk_cluster_setorial
        data_type: varchar
        entity:
          type: primary
          name: cluster_setorial
        tests: [unique, not_null]
      - name: codigo_uf
        data_type: integer
      - name: sigla_uf
        data_type: varchar
        dimension:
          type: categorical
      - name: nome_uf
        data_type: varchar
        dimension:
          type: categorical
      - name: sigla_regiao
        data_type: varchar
        dimension:
          type: categorical
      - name: nome_regiao
        data_type: varchar
        dimension:
          type: categorical
      - name: codigo_secao_cnae
        data_type: varchar
        dimension:
          type: categorical
      - name: descricao_secao_cnae
        data_type: varchar
        dimension:
          type: categorical
      - name: ano_referencia
        data_type: integer
      - name: num_empresas
        data_type: integer
      - name: pessoal_ocupado_total
        data_type: integer
      - name: pessoal_ocupado_assalariado
        data_type: integer
      - name: massa_salarial_real_mil_brl
        data_type: double
      - name: has_sigilo_estatistico
        data_type: boolean
        dimension:
          type: categorical
      - name: quociente_locacional_emprego
        data_type: double
      - name: quociente_locacional_massa_salarial
        data_type: double
      - name: market_share_uf_no_setor_pct
        data_type: double
      - name: crescimento_emprego_setor_yoy_pct
        data_type: double
      - name: perfil_especializacao
        data_type: varchar
        dimension:
          type: categorical
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "CLUSTER_DOMINANTE"
                  - "CLUSTER_ESPECIALIZADO"
                  - "EQUILIBRADO_MEDIA_NACIONAL"
                  - "SUB_REPRESENTADO"
                  - "SIGILO_OU_INDISPONIVEL"
    metrics:
      - name: emprego_setorial_total
        type: simple
        label: "Emprego Setorial Total (CEMPRE UF)"
        description: "Pessoal ocupado total por UF e secao CNAE 2.0."
        agg: sum
        expr: pessoal_ocupado_total
      - name: massa_salarial_setorial_real_mil_brl
        type: simple
        label: "Massa Salarial Setorial Real (Mil BRL)"
        description: "Massa salarial real acumulada por UF e secao CNAE 2.0."
        agg: sum
        expr: massa_salarial_real_mil_brl
      - name: ql_emprego_medio
        type: simple
        label: "Quociente Locacional Medio de Emprego"
        description: "Media do Quociente Locacional (QL) de emprego no recorte."
        agg: average
        expr: quociente_locacional_emprego

  - name: mart_pulso_consumo_macro
    description: >
      Data Mart mensal de pulso do varejo ampliado (PMC) cruzado com IPCA, medindo spread preco vs volume,
      medias moveis 3m/12m e regime de consumo por UF e atividade comercial.
    config:
      contract:
        enforced: true
    semantic_model:
      enabled: true
    agg_time_dimension: data_referencia
    columns:
      - name: sk_pulso_consumo
        data_type: varchar
        entity:
          type: primary
          name: pulso_consumo
        tests: [unique, not_null]
      - name: codigo_uf
        data_type: integer
