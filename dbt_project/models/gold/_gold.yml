unit_tests:
  - name: test_quociente_locacional_cluster_especializado
    description: "Valida a formula exata do Quociente Locacional (QL = 1.60 -> CLUSTER_DOMINANTE) na matriz UF x CNAE."
    model: mart_clusters_setoriais_uf
    given:
      - input: ref('dim_geografia')
        format: sql
        rows: |
          select 35::integer as codigo_uf, 'SP'::varchar as sigla_uf, 'São Paulo'::varchar as nome_uf, 'SE'::varchar as sigla_regiao, 'Sudeste'::varchar as nome_regiao, true::boolean as is_current
          union all
          select 51::integer, 'MT'::varchar, 'Mato Grosso'::varchar, 'CO'::varchar, 'Centro-Oeste'::varchar, true::boolean
      - input: ref('dim_cnae')
        format: sql
        rows: |
          select 'sk_a'::varchar as sk_cnae_secao, 'A'::varchar as codigo_secao, 'Agricultura'::varchar as descricao_secao, true::boolean as is_current
          union all
          select 'sk_c'::varchar, 'C'::varchar, 'Industria'::varchar, true::boolean
      - input: ref('fct_cempre_setorial_uf')
        format: sql
        rows: |
          select 51::integer as codigo_uf, 'A'::varchar as codigo_secao_cnae, 2024::integer as ano_referencia, 100::integer as num_empresas, 80::integer as pessoal_ocupado_total, 70::integer as pessoal_ocupado_assalariado, 800.0::double as massa_salarial_real_mil_brl, false::boolean as has_sigilo_estatistico
          union all
          select 51::integer, 'C'::varchar, 2024::integer, 20::integer, 20::integer, 15::integer, 200.0::double, false::boolean
          union all
          select 35::integer, 'A'::varchar, 2024::integer, 20::integer, 20::integer, 15::integer, 200.0::double, false::boolean
          union all
          select 35::integer, 'C'::varchar, 2024::integer, 80::integer, 80::integer, 70::integer, 800.0::double, false::boolean
    expect:
      format: sql
      rows: |
        select md5('51-A-2024') as sk_cluster_setorial, 51::integer as codigo_uf, 'MT'::varchar as sigla_uf, 'Mato Grosso'::varchar as nome_uf, 'CO'::varchar as sigla_regiao, 'Centro-Oeste'::varchar as nome_regiao, 'A'::varchar as codigo_secao_cnae, 'Agricultura'::varchar as descricao_secao_cnae, 2024::integer as ano_referencia, 100::integer as num_empresas, 80::integer as pessoal_ocupado_total, 70::integer as pessoal_ocupado_assalariado, 800.0::double as massa_salarial_real_mil_brl, false::boolean as has_sigilo_estatistico, 1.6::double as quociente_locacional_emprego, 1.6::double as quociente_locacional_massa_salarial, 80.0::double as market_share_uf_no_setor_pct, null::double as crescimento_emprego_setor_yoy_pct, 'CLUSTER_DOMINANTE'::varchar as perfil_especializacao
        union all
        select md5('51-C-2024'), 51::integer, 'MT'::varchar, 'Mato Grosso'::varchar, 'CO'::varchar, 'Centro-Oeste'::varchar, 'C'::varchar, 'Industria'::varchar, 2024::integer, 20::integer, 20::integer, 15::integer, 200.0::double, false::boolean, 0.4::double, 0.4::double, 20.0::double, null::double, 'SUB_REPRESENTADO'::varchar
        union all
        select md5('35-A-2024'), 35::integer, 'SP'::varchar, 'São Paulo'::varchar, 'SE'::varchar, 'Sudeste'::varchar, 'A'::varchar, 'Agricultura'::varchar, 2024::integer, 20::integer, 20::integer, 15::integer, 200.0::double, false::boolean, 0.4::double, 0.4::double, 20.0::double, null::double, 'SUB_REPRESENTADO'::varchar
        union all
